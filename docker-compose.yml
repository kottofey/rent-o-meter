networks:
  rent-o-meter:

volumes:
  db:

services:
  backend:
    working_dir: /usr/src/app
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "8892:8892"
    build:
      context: ./backend
    networks:
      - rent-o-meter
    volumes:
#   относительный путь относительно файла docker-compose.yml : абсолютный путь внутри контейнера
      - ./backend/.env:/usr/src/app/.env
      - ./backend/src/sequelize/seeders/:/usr/src/app/src/sequelize/seeders/
      - ./backend/src/sequelize/migrations/:/usr/src/app/src/sequelize/migrations/
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: 'json-file'
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    working_dir: /usr/src/app
    restart: unless-stopped
    ports:
      - "8893:8893"
    build:
      context: ./frontend
    volumes:
      #   относительный путь относительно файла docker-compose.yml : абсолютный путь внутри контейнера
      - ./frontend/src/app/env/:/usr/src/app/env/
      - ./.ssl/:/usr/src/app/.ssl/
    networks:
      - rent-o-meter
    logging:
      driver: 'json-file'
      options:
        max-size: "10m"
        max-file: "3"

  db:
    networks:
      - rent-o-meter
    image: mysql:8
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=$MYSQL_DATABASE
    ports:
      - $MYSQLDB_LOCAL_PORT:$MYSQLDB_DOCKER_PORT
    volumes:
      - db:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --innodb-log-buffer-size=16M
      - --key-buffer-size=32M
